# Refresh the per-index "companies inside the blob" files on their own, slower cron.
# Split out of fetch.yml (2026-09-28): once Nasdaq's top-500 fetch was measured at ~5.5 min and
# the S&P 500's at ~2 min, the two together already ate most of a 10-minute slot before Dow, the
# checks, and the commit/push even ran — a Russell 2000 door (also ~500 names) would have made
# the fetch.yml job comfortably miss its next scheduled start, since cancel-in-progress is false
# and runs queue instead of overlapping.
#
# ponytail: every 15 minutes (30 until 2026-09-30, Clark's mm20) is a guess, not a measured ceiling — it just needs to be bigger than
# the slowest single index's fetch time (~6 min measured for Nasdaq) with headroom for GitHub's
# best-effort cron slippage (5-20 min late, same caveat as fetch.yml). Ceiling: fine as long as no
# single index's roster+price fetch creeps past ~15 min. Upgrade path if it does: cache each
# index's ROSTER (the slow, rarely-changing part — which symbols are members) once a day in its
# own file, and have this workflow fetch only PRICES for the cached roster every run; that turns
# the roster's one-time cost (the HTTP calls in ROSTERS[key](), which is most of Nasdaq's ~5.5 min)
# into a once-daily cost, leaving only per-symbol price calls (caps()/spark()) on the 15-min cycle.
# A full run (all four) measured ~8-9 min, so 15 leaves ~6 min of slack; a late start queues, never overlaps.
#
# 2026-10-01 (Clark: "still stale"): two causes. (1) fetch.py crashed on every run since the volume
# heartbeat widened bars to [t, close, volume]; the `|| echo ::warning` below swallowed it, so runs were
# green while data/companies*.json froze at 09-30 17:07Z. Now a failed index fails the run (after the good
# ones are committed). (2) GitHub's schedule trigger fired ~3 of ~33 times; the cron only bootstraps a chain
# (tools/loop.sh: one round per 15 min for ~50 min, then it starts the next link itself).
name: fetch index companies
on:
  schedule:
    - cron: "7,22,37,52 13-20 * * 1-5"   # every 15 min (mm20), odd minutes (busiest cron slots are :00/:10/:15)
    - cron: "27 21 * * 1-5"        # once after the close
  workflow_dispatch:
    inputs: { force: { description: "test: two rounds even if closed, no chaining", required: false } }
permissions:
  contents: write
  actions: write
concurrency: { group: companies, cancel-in-progress: false }
jobs:
  companies:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: tools/loop.sh companies.yml 900 market tools/companies_round.sh
        env:
          GH_TOKEN: "${{ github.token }}"
          LOOP_FORCE: "${{ github.event.inputs.force }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
