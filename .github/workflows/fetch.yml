# Refresh data/market.json every 10 minutes while US markets can be open, plus once after
# the close. Commits only when the numbers changed. Pages redeploys from main on each commit.
# ponytail: GitHub cron is best-effort (runs can start 5-20 min late) and a scheduled workflow
# pauses after 60 days without repo activity. Ceiling: a prototype's "delayed" promise.
# Upgrade path: a fetcher on the client's own host (cron + licensed feed), page reads it there.
#
# The per-index COMPANIES files (data/companies*.json) are fetched by a separate, slower
# workflow (companies.yml) on its own cron — see that file for why. This workflow only ever
# touches data/market.json, so it stays fast (~20-30s measured) and never risks missing its
# 10-minute slot because a companies fetch ran long.
#
# 2026-10-01 (client: "still stale"): the schedule trigger fired ~3 times a weekday, not 49 - GitHub
# throttles it. So the cron below only BOOTSTRAPS: tools/loop.sh then runs a round every 10 minutes
# for ~50 min and starts the next link itself (see that file). Odd minutes: :00/:10 are the busiest slots.
name: fetch market data
on:
  schedule:
    - cron: "3,13,23,33,43,53 13-20 * * 1-5"   # 13:00-20:59 UTC covers 9:30-16:00 ET in both EDT and EST
    - cron: "17 21 * * 1-5"        # after the close, so replay always has the full day
  workflow_dispatch:
    inputs: { force: { description: "test: two rounds even if closed, no chaining", required: false } }
permissions:
  contents: write
  actions: write
concurrency: { group: fetch, cancel-in-progress: false }
jobs:
  fetch:
    if: github.repository == 'Onasidequestt/market-moods'   # a fork or a copy must not start these clocks; change this if the repo moves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python3 fetch.py --selfcheck
      - run: tools/loop.sh fetch.yml 600 market tools/market_round.sh
        env:
          GH_TOKEN: "${{ github.token }}"
          LOOP_FORCE: "${{ github.event.inputs.force }}"
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CF_PAGES_PROJECT: market-moods-preview   # our preview project; the client's own project goes here when his domain goes live
